esphome:
  name: screenbar-halo2
  friendly_name: BenQ ScreenBar HALO 2
  includes:
    - bm5602_halo2.h
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          const auto v=bm5602_halo2::setup_exact_pico(
            bm5602_halo2::RADIO_ADDRESS,bm5602_halo2::RADIO_CHANNEL);
          if(v[0]!=0x56||v[1]!=0x02||v[2]!=0x01){
            char error[80]; snprintf(error,sizeof(error),"BM5602 ERROR VERSION=%02X %02X %02X",v[0],v[1],v[2]);
            id(radio_status).publish_state(error); return;
          }
          bm5602_halo2::prepare_halo_receive();
          char text[96]; snprintf(text,sizeof(text),"READY VERSION=%02X %02X %02X TBCLK=G25 RX=ON",
            v[0],v[1],v[2]); id(radio_status).publish_state(text);

esp32:
  board: m5stack-atom
  flash_size: 4MB
  framework:
    type: esp-idf
logger:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "Halo2 recovery"
    password: !secret fallback_password
captive_portal:
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
web_server:
  port: 80
  ota: false
  auth:
    username: !secret web_username
    password: !secret web_password

globals:
  - { id: halo_power, type: bool, restore_value: yes, initial_value: "false" }
  - { id: halo_pir, type: bool, restore_value: yes, initial_value: "false" }
  - { id: halo_front, type: bool, restore_value: yes, initial_value: "true" }
  - { id: halo_back, type: bool, restore_value: yes, initial_value: "true" }
  - { id: halo_front_brightness, type: uint8_t, restore_value: yes, initial_value: "12" }
  - { id: halo_back_brightness, type: uint8_t, restore_value: yes, initial_value: "91" }
  - { id: halo_temperature, type: uint16_t, restore_value: yes, initial_value: "3925" }

text_sensor:
  - platform: template
    id: radio_status
    name: "Radio status"
  - platform: template
    id: lamp_state
    name: "Lamp state"

switch:
  - platform: template
    id: screenbar_power
    name: "Power"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(halo_power)=true;
          const bool ok=bm5602_halo2::send_halo_state(0x02,true,id(halo_pir),id(halo_front),id(halo_back),
            id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature));
          char t[96]; snprintf(t,sizeof(t),"ON PCF=%02X CRC=%04X %s",bm5602_halo2::halo_last_pcf,
            bm5602_halo2::halo_last_crc,ok?"sent":"NO CLOCK"); id(radio_status).publish_state(t);
    turn_off_action:
      - lambda: |-
          id(halo_power)=false;
          const bool ok=bm5602_halo2::send_halo_state(0x02,false,id(halo_pir),id(halo_front),id(halo_back),
            id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature));
          char t[96]; snprintf(t,sizeof(t),"OFF PCF=%02X CRC=%04X %s",bm5602_halo2::halo_last_pcf,
            bm5602_halo2::halo_last_crc,ok?"sent":"NO CLOCK"); id(radio_status).publish_state(t);
  - platform: template
    id: front_lamp_switch
    name: "Front lamp"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(halo_front)=true; id(halo_power)=true; id(screenbar_power).publish_state(true);
          id(lamp_mode).publish_state(id(halo_back)?"Both":"Front");
          bm5602_halo2::send_halo_state(0x03,true,id(halo_pir),true,id(halo_back),
            id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature));
    turn_off_action:
      - lambda: |-
          id(halo_front)=false;
          if(!id(halo_back)){id(halo_power)=false;id(screenbar_power).publish_state(false);}
          id(lamp_mode).publish_state(id(halo_back)?"Back":"Front");
          bm5602_halo2::send_halo_state(0x03,id(halo_power),id(halo_pir),false,id(halo_back),
            id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature));
  - platform: template
    id: back_lamp_switch
    name: "Back lamp"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(halo_back)=true; id(halo_power)=true; id(screenbar_power).publish_state(true);
          id(lamp_mode).publish_state(id(halo_front)?"Both":"Back");
          bm5602_halo2::send_halo_state(0x03,true,id(halo_pir),id(halo_front),true,
            id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature));
    turn_off_action:
      - lambda: |-
          id(halo_back)=false;
          if(!id(halo_front)){id(halo_power)=false;id(screenbar_power).publish_state(false);}
          id(lamp_mode).publish_state(id(halo_front)?"Front":"Back");
          bm5602_halo2::send_halo_state(0x03,id(halo_power),id(halo_pir),id(halo_front),false,
            id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature));
  - platform: template
    id: pir_switch
    name: "Ultrasonic sensor"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(halo_pir)=true;
          bm5602_halo2::send_halo_state(0x03,id(halo_power),true,id(halo_front),id(halo_back),
            id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature));
    turn_off_action:
      - lambda: |-
          id(halo_pir)=false;
          bm5602_halo2::send_halo_state(0x03,id(halo_power),false,id(halo_front),id(halo_back),
            id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature));

number:
  - platform: template
    id: front_brightness
    name: "Front brightness"
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 12
    set_action:
      - lambda: |-
          id(halo_front_brightness)=static_cast<uint8_t>(x);
          bm5602_halo2::send_halo_state(0x03,id(halo_power),id(halo_pir),id(halo_front),id(halo_back),
            id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature));
  - platform: template
    id: back_brightness
    name: "Back brightness"
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 91
    set_action:
      - lambda: |-
          id(halo_back_brightness)=static_cast<uint8_t>(x);
          bm5602_halo2::send_halo_state(0x03,id(halo_power),id(halo_pir),id(halo_front),id(halo_back),
            id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature));
  - platform: template
    id: color_temperature
    name: "Color temperature"
    unit_of_measurement: "K"
    min_value: 2700
    max_value: 6500
    step: 25
    optimistic: true
    restore_value: true
    initial_value: 3925
    set_action:
      - lambda: |-
          id(halo_temperature)=static_cast<uint16_t>(x);
          bm5602_halo2::send_halo_state(0x03,id(halo_power),id(halo_pir),id(halo_front),id(halo_back),
            id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature));

select:
  - platform: template
    id: lamp_mode
    name: "Lamp mode"
    options: ["Front", "Back", "Both"]
    optimistic: true
    restore_value: true
    initial_option: "Both"
    set_action:
      - lambda: |-
          id(halo_front)=(x=="Front"||x=="Both");
          id(halo_back)=(x=="Back"||x=="Both");
          id(front_lamp_switch).publish_state(id(halo_front));
          id(back_lamp_switch).publish_state(id(halo_back));
          bm5602_halo2::send_halo_state(0x03,id(halo_power),id(halo_pir),id(halo_front),id(halo_back),
            id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature));

button:
  - platform: template
    name: "Resend current state"
    on_press:
      - lambda: |-
          const bool ok=bm5602_halo2::send_halo_state(0x03,id(halo_power),id(halo_pir),id(halo_front),id(halo_back),
            id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature));
          char t[96]; snprintf(t,sizeof(t),"APPLY PCF=%02X CRC=%04X %s",bm5602_halo2::halo_last_pcf,
            bm5602_halo2::halo_last_crc,ok?"sent":"NO CLOCK"); id(radio_status).publish_state(t);
  - platform: restart
    name: "Restart"

interval:
  - interval: 50ms
    then:
      - lambda: |-
          static uint32_t last_publish=0;
          bm5602_halo2::HaloRxState s;
          const bool received=bm5602_halo2::poll_halo_receive(s)&&s.valid;
          if(received){
            id(halo_power)=s.power; id(halo_pir)=s.pir; id(halo_front)=s.front; id(halo_back)=s.back;
            id(halo_front_brightness)=s.front_brightness; id(halo_back_brightness)=s.back_brightness;
            id(halo_temperature)=s.color_temperature;
            id(screenbar_power).publish_state(s.power);
            id(front_lamp_switch).publish_state(s.front);
            id(back_lamp_switch).publish_state(s.back);
            id(pir_switch).publish_state(s.pir);
            id(front_brightness).publish_state(s.front_brightness);
            id(back_brightness).publish_state(s.back_brightness);
            id(color_temperature).publish_state(s.color_temperature);
            id(lamp_mode).publish_state(s.front&&s.back?"Both":(s.back?"Back":"Front"));
          }
          const uint32_t now=millis();
          if(!received&&now-last_publish<2000U)return;
          last_publish=now;
          char state[192]; snprintf(state,sizeof(state),
            "{\"power\":%d,\"front\":%d,\"back\":%d,\"pir\":%d,\"front_brightness\":%d,\"back_brightness\":%d,\"temperature\":%d}",
            id(halo_power),id(halo_front),id(halo_back),id(halo_pir),id(halo_front_brightness),id(halo_back_brightness),id(halo_temperature));
          id(lamp_state).publish_state(state);
